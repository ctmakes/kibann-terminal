[package]
name = "kibann"
version = "0.1.0-rc.1"
edition.workspace = true
license.workspace = true
description = "Kibann Terminal: Tauri shell around the term session and the web renderer"

[lib]
name = "kibann_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
proto = { path = "../../crates/proto" }
daemon = { path = "../../crates/daemon" }
term = { path = "../../crates/term" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

# The menu-bar icon (tray.rs).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# The installed monospaced fonts (fonts.rs).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString", "CFCGTypes"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTFontManager", "CTFontTraits"] }
