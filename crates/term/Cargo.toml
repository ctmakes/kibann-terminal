[package]
name = "term"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Terminal session: PTY + libghostty-vt emulator + frame builder. No Tauri dependency."

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proto = { path = "../proto" }
# libghostty-vt 1.0.1 support is on main but not yet on crates.io (0.2.2 targets
# a pre-1.0 commit). Pinned by commit; move to the crates.io release once it ships.
# Building it needs Zig 0.17 on PATH.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
