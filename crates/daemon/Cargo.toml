[package]
name = "daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "kibannd: owns the terminal sessions so they outlive the app"

[[bin]]
name = "kibannd"
path = "src/bin/kibannd.rs"

[dependencies]
proto = { path = "../proto" }
client = { path = "../client" }
endpoint = { path = "../endpoint" }
term = { path = "../term" }
git = { path = "../git" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
toml = "1"
