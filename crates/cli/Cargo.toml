[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The kibann command line, and the diff viewer it opens in a pane"

[[bin]]
name = "kibann-cli"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
client = { path = "../client" }
files = { path = "../files" }
serde_json = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
daemon = { path = "../daemon" }
