[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/agent",
    "crates/term",
    "crates/git",
    "crates/endpoint",
    "crates/procinfo",
    "crates/client",
    "crates/daemon",
    "crates/files",
    "crates/cli",
    "app/src-tauri",
]

[workspace.package]
# The app's version, for every crate: scripts/bump-version.sh sets it.
version = "0.7.1"
edition = "2024"
license = "MIT"
