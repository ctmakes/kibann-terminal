# Four agents in a grid, for fanning work out. The agent is the first of
# Claude Code, Codex and OpenCode that's installed.
name = "agents-4"

[[tab]]
title = "agents"
split = "down"
panes = [
  { split = "right", panes = [
    { command = ["claude", "codex", "opencode"], focus = true, missing = "no agent installed: Claude Code, Codex or OpenCode" },
    { command = ["claude", "codex", "opencode"], missing = "no agent installed: Claude Code, Codex or OpenCode" },
  ] },
  { split = "right", panes = [
    { command = ["claude", "codex", "opencode"], missing = "no agent installed: Claude Code, Codex or OpenCode" },
    { command = ["claude", "codex", "opencode"], missing = "no agent installed: Claude Code, Codex or OpenCode" },
  ] },
]
