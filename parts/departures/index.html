<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    --cell: 18px;
    background: radial-gradient(ellipse at 50% 0%, #1b1b1b 0%, #050505 70%);
    color: #ffd23f; user-select: none; -webkit-user-select: none;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; padding: 14px 18px 10px;
  }
  .top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .top h1 { margin: 0; font: 600 calc(var(--cell) * 0.95) / 1 system-ui, sans-serif; letter-spacing: .18em; color: #f5f5f5; }
  .top .plane { font-size: calc(var(--cell) * 1.1); color: #ffd23f; }
  .top .clock { margin-left: auto; font-size: calc(var(--cell) * 1.05); color: #ffd23f; letter-spacing: .1em; }
  .head, .row { display: grid; grid-template-columns: var(--cols); column-gap: calc(var(--cell) * 0.9); align-items: center; }
  .head { color: #8a8a8a; font: 600 calc(var(--cell) * 0.5) / 1 system-ui, sans-serif; letter-spacing: .16em; padding-bottom: 6px; border-bottom: 1px solid #262626; margin-bottom: 6px; }
  .rows { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .row { cursor: default; padding: 2px 0; border-radius: 4px; }
  .row:hover { background: #ffffff0d; }
  .flaps { display: flex; gap: 2px; }
  .f {
    position: relative; width: calc(var(--cell) * 0.74); height: var(--cell);
    background: linear-gradient(#181818 0 49%, #0c0c0c 51% 100%);
    border-radius: 2px; box-shadow: inset 0 -1px 0 #000, 0 1px 0 #ffffff08;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * 0.72); font-weight: 600; line-height: 1;
  }
  .f::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000c; }
  .f.flip { animation: flip .07s linear; }
  @keyframes flip { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); filter: brightness(1.6); } 100% { transform: scaleY(1); } }
  .r-blocked .remark .f { color: #ff9f1c; animation: blink 1.1s steps(2, start) infinite; }
  .r-done .remark .f { color: #7ee787; }
  .r-working .remark .f { color: #79c0ff; }
  .r-idle .remark .f, .r-none .remark .f { color: #9a9a9a; }
  .focused .flight .f { color: #ffffff; }
  @keyframes blink { to { opacity: .35; } }
  .empty { color: #555; font: 14px system-ui, sans-serif; padding: 20px 0; }
</style>
</head>
<body>
  <div class="top"><span class="plane">✈</span><h1>DEPARTURES</h1><span class="clock" id="clock"></span></div>
  <div class="head" id="head"><span>TIME</span><span>FLIGHT</span><span>DESTINATION</span><span>GATE</span><span>REMARKS</span></div>
  <div class="rows" id="rows"></div>
<script>
  // Widths of the columns, in flaps.
  const W = { time: 5, flight: 6, dest: 18, gate: 3, remark: 10 };
  const ALPHABET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-/·";
  const REMARK = { working: "BOARDING", blocked: "SEE AGENT", done: "LANDED", idle: "ON TIME" };
  const RANK = { blocked: 0, done: 1, working: 2, idle: 3 };
  const rowsEl = document.getElementById("rows");
  const rows = new Map(); // pane id -> row

  function fit() {
    // Flaps sized so the columns fill the width.
    const total = W.time + W.flight + W.dest + W.gate + W.remark;
    const width = document.body.clientWidth - 36;
    const cell = Math.max(10, Math.min(30, width / (total * 0.84 + 4 * 0.9)));
    document.body.style.setProperty("--cell", `${cell}px`);
    const col = (n) => `calc(var(--cell) * ${n * 0.74} + ${(n - 1) * 2}px)`;
    document.body.style.setProperty("--cols", [W.time, W.flight, W.dest, W.gate, W.remark].map(col).join(" "));
  }

  function flaps(n) {
    const el = document.createElement("span");
    el.className = "flaps";
    for (let i = 0; i < n; i++) {
      const f = document.createElement("span");
      f.className = "f";
      f.textContent = " ";
      el.append(f);
    }
    return el;
  }

  // Turn each flap toward its letter through the alphabet, a few steps at
  // a time, like the real thing.
  function setText(el, text) {
    const want = text.toUpperCase().padEnd(el.children.length, " ").slice(0, el.children.length);
    [...el.children].forEach((f, i) => {
      const target = ALPHABET.includes(want[i]) ? want[i] : want[i] === undefined ? " " : want[i];
      if (f.dataset.want === target) return;
      f.dataset.want = target;
      clearInterval(f._t);
      let at = Math.max(0, ALPHABET.indexOf(f.textContent));
      const end = ALPHABET.indexOf(target);
      let steps = end < 0 ? 1 : (end - at + ALPHABET.length) % ALPHABET.length;
      steps = Math.min(steps, 6 + ((i * 3) % 7));
      if (steps === 0) { f.textContent = target; return; }
      f._t = setInterval(() => {
        steps--;
        at = (at + 1) % ALPHABET.length;
        f.textContent = steps <= 0 ? target : ALPHABET[at];
        f.classList.remove("flip");
        void f.offsetWidth;
        f.classList.add("flip");
        if (steps <= 0) clearInterval(f._t);
      }, 60);
    });
  }

  function row(id) {
    let r = rows.get(id);
    if (r) return r;
    const el = document.createElement("div");
    el.className = "row";
    const cols = { time: flaps(W.time), flight: flaps(W.flight), dest: flaps(W.dest), gate: flaps(W.gate), remark: flaps(W.remark) };
    cols.flight.classList.add("flight");
    cols.remark.classList.add("remark");
    el.append(cols.time, cols.flight, cols.dest, cols.gate, cols.remark);
    el.addEventListener("click", () => kibann.run("pane.focus", { pane: id }));
    r = { el, cols };
    rows.set(id, r);
    return r;
  }

  const code = (p) => {
    const a = (p.agent || "sh").replace(/[^a-z]/gi, "").toUpperCase();
    const two = a === "CLAUDE" ? "CL" : a === "CODEX" ? "CX" : a === "OPENCODE" ? "OC" : a === "GEMINI" ? "GM" : a.slice(0, 2);
    return `${two}${String(p.id).padStart(3, "0")}`;
  };
  const hhmm = (t) => {
    const d = t ? new Date(t) : new Date();
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  kibann.on("state", (s) => {
    const tabNo = new Map(s.tabs.map((t, i) => [t.id, i + 1]));
    const order = [...s.panes].sort((a, b) => (RANK[a.state] ?? 4) - (RANK[b.state] ?? 4));
    const ids = new Set(order.map((p) => p.id));
    for (const [id, r] of rows) if (!ids.has(id)) { r.el.remove(); rows.delete(id); }
    order.forEach((p, i) => {
      const r = row(p.id);
      r.el.className = `row r-${p.state ?? "none"} ${p.id === s.focused ? "focused" : ""}`;
      const dest = p.repo ? `${p.repo}${p.branch ? "/" + p.branch : ""}` : (p.cwd.split("/").filter(Boolean).pop() ?? "~");
      setText(r.cols.time, hhmm(p.since));
      setText(r.cols.flight, code(p));
      setText(r.cols.dest, dest);
      setText(r.cols.gate, `T${tabNo.get(p.tab) ?? ""}`);
      setText(r.cols.remark, p.state ? REMARK[p.state] : "PARKED");
      if (rowsEl.children[i] !== r.el) rowsEl.insertBefore(r.el, rowsEl.children[i] || null);
    });
  });

  const clock = () => (document.getElementById("clock").textContent = hhmm());
  new ResizeObserver(fit).observe(document.body);
  fit();
  clock();
  setInterval(clock, 5000);
</script>
</body>
</html>
